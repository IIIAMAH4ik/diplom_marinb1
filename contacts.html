<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Контакты — EduStart</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">EduStart</a>
        <nav class="main-nav">
          <a href="courses.html">Курсы</a>
          <a href="faq.html">FAQ</a>
          <a href="contacts.html">Контакты</a>
          <a class="btn-login" href="login.html">Войти</a>
          <a class="btn-logout" href="#" style="display:none">Выход</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="container featured" style="padding-top:40px">
        <h1>Контакты</h1>
        <p class="lead" style="margin-top:12px">Свяжитесь с нами через форму или по почте.</p>

        <form style="margin-top:18px;max-width:640px">
          <label style="display:block;margin-bottom:8px">Ваш e-mail</label>
          <input type="email" placeholder="you@example.com" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ef;margin-bottom:12px">

          <label style="display:block;margin-bottom:8px">Сообщение</label>
          <textarea rows="6" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ef;margin-bottom:12px"></textarea>

          <button type="submit" style="background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;border:none">Отправить</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 EduStart</p>
        <nav class="footer-nav">
          <a href="#">Политика</a>
          <a href="#">Условия</a>
        </nav>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
